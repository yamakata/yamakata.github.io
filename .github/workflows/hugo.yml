name: Pages redirect deploy

# 研究室サイトは https://www.yyl.itc.u-tokyo.ac.jp/ へ移転したため、
# GitHub Pages には Hugo のビルド結果ではなく、リポジトリ直下の
# 転送用ページ（index.html / 404.html）だけを配信する。
# 404.html も同じ転送ページなので、旧 URL（/ja/... や /en/...）に
# アクセスされた場合も新サイトのトップへ転送される。
#
# トリガー:
# - main への push        → デプロイ
# - pull_request          → アップロードまでの確認のみ
# - workflow_dispatch      → 手動実行
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# 既定は権限なし。必要な権限は各 job 側で最小限だけ付与する。
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 配信するのはリポジトリ直下の転送ページ2つだけ。
      - name: Collect redirect pages
        run: |
          mkdir _site
          cp index.html 404.html _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    # main ブランチ上での push / 手動実行のときだけデプロイする。
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

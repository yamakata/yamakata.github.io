# -- 日本語メインメニュー --
# Blowfish のメニューテンプレート（desktop-menu.html）は各項目の `name` を
# そのまま表示するだけで、i18n キーからの自動解決は行わない。そのため
# 多言語対応は「言語ごとにメニューファイルを分けて、それぞれの言語で
# name を直接書く」という Hugo 標準の方式を採る（このファイルと
# menus.en.toml で対応）。
#
# P1 ではまだページが存在しないため、トップページへのリンクのみを有効にする。

[[main]]
  name = "ホーム"
  pageRef = "/"
  weight = 1


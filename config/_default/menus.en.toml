# -- English main menu --
# Same structure as menus.ja.toml. Blowfish's menu template renders each
# item's `name` verbatim (no i18n key resolution), so per-language menu
# files with hardcoded, already-translated names is the standard approach.
#
# Only the homepage entry is enabled in P1, since the other pages don't
# exist yet.

[[main]]
  name = "Home"
  pageRef = "/"
  weight = 1


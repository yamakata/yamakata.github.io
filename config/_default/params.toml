# -- テーマ表示設定 --
# キーは Hugo Modules キャッシュ内の Blowfish 本体
# (github.com/nunocoracao/blowfish/v3 config/_default/params.toml) に実在する
# ものだけを使用している。
#
# 調べた結果、Blowfish がビルドに必須とするパラメータ（未設定だとエラーや警告に
# なるもの）は無く、site 側で何も指定しなければテーマの既定値がそのまま使われる。
# 以下は「既定値と同じ値」だが、このサイトが profile レイアウトを選んでいることを
# 明示するために書いている。

[homepage]
  layout = "profile" # 著者プロフィール型。本文（_index.md）がそのまま section として表示される。
